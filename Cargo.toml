[package]
name = "tree-sitter-doxygen"
description = "tree-sitter grammer for Doxygen markup"
version = "0.0.1"
authors = ["Marian Buschsieweke <marian.buschsieweke@posteo.net>"]
license = "0BSD"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "doxygen"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://codeberg.org/maribu/tree-sitter-doxygen"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.6"
